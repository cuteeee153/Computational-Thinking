<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汪探 WanTan Reveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;900&family=Inter:wght@500;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141110; --paper:#F4EEE3; --red:#C43211; --night:#100E0C; --cream:#F4EEE3;
  --ui-bg:#0A0908; --ui-fg:#CFC6B8; --ui-dim:#6E665C;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ui-bg);color:var(--ui-fg);font-family:Inter,system-ui,sans-serif;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#viewport{position:relative;width:100%;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);border-radius:6px}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--night)}
#world{position:absolute;inset:0;transform-origin:50% 50%}
svg{position:absolute;left:0;top:0;overflow:visible}
#fx{position:absolute;left:0;top:0;pointer-events:none}

/* type */
.cn{position:absolute;left:1000px;top:318px;height:250px;display:flex;gap:6px;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-weight:900;font-size:236px;line-height:250px;color:var(--ink)}
.cn .m{display:block;overflow:hidden;height:270px;margin-top:-10px;padding-top:10px}
.cn .c{display:block;will-change:transform}
.cn-glint{position:absolute;left:1000px;top:318px;height:250px;display:flex;gap:6px;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-weight:900;font-size:236px;line-height:250px;
  color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(105deg,transparent 42%,rgba(255,236,214,.85) 50%,transparent 58%);background-size:300% 100%;background-repeat:no-repeat}
#wipe{position:absolute;left:992px;top:330px;width:500px;height:244px;background:var(--red);transform-origin:0 50%;transform:scaleX(0)}
.en{position:absolute;left:1008px;top:600px;font-family:Inter,sans-serif;font-weight:800;font-size:70px;line-height:1;color:var(--ink);white-space:nowrap}
.en span{display:inline-block;will-change:transform,filter,opacity}
#rule{position:absolute;left:1010px;top:708px;width:470px;height:5px;background:var(--red);transform-origin:0 50%;transform:scaleX(0)}
#dot{position:absolute;left:1494px;top:703px;width:15px;height:15px;border-radius:50%;background:var(--red);transform:scale(0)}
.tag{position:absolute;left:1010px;top:738px;font-family:"Noto Sans TC",sans-serif;font-weight:500;font-size:27px;letter-spacing:.18em;color:#4A423A;white-space:nowrap}
.tag b{font-family:Inter,sans-serif;font-weight:500;font-size:20px;letter-spacing:.32em;color:#8A8076;margin-left:14px}

/* HUD + slate */
.hud{position:absolute;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:19px;letter-spacing:.08em;color:var(--cream);white-space:pre}
.slate{position:absolute;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:17px;letter-spacing:.14em;color:#fff;mix-blend-mode:difference;opacity:.8;white-space:pre}
#grain{position:absolute;inset:-64px;pointer-events:none;mix-blend-mode:overlay;opacity:.16}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.55) 100%)}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}

/* controls */
#controls{display:flex;align-items:center;gap:10px;width:min(100%,900px);flex:0 0 auto}
#controls button{background:#1C1916;color:var(--ui-fg);border:1px solid #2E2A25;border-radius:8px;height:36px;padding:0 12px;
  font:600 13px/1 Inter,sans-serif;cursor:pointer;white-space:nowrap}
#controls button:hover{background:#26221E}
#controls button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
#scrub{flex:1;min-width:60px;accent-color:var(--red)}
#tc{font:500 13px/1 "JetBrains Mono",monospace;color:var(--ui-dim);width:64px;text-align:right}
@media (max-width:560px){#controls{gap:6px}#controls button{padding:0 9px;font-size:12px}#tc{display:none}}
body.capture{padding:0;background:#000}
body.capture #controls{display:none}
body.capture #frame{box-shadow:none;border-radius:0}
</style>

<script>
(()=>{

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));

const lerp=(a,b,k)=>a+(b-a)*k;
const outCubic=k=>1-Math.pow(1-k,3);
const outQuart=k=>1-Math.pow(1-k,4);
const outExpo=k=>k>=1?1:1-Math.pow(2,-10*k);
const inOutExpo=k=>k<=0?0:k>=1?1:k<.5?Math.pow(2,20*k-10)/2:(2-Math.pow(2,-20*k+10))/2;
const inOutCubic=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const inOutSine=k=>-(Math.cos(Math.PI*k)-1)/2;
const outBack=(k,s=2.2)=>k<=0?0:1+(s+1)*Math.pow(k-1,3)+s*Math.pow(k-1,2);
const spring=(dt,amp,freq=18,damp=7)=>dt<0?0:amp*Math.exp(-damp*dt)*Math.cos(freq*dt); // dt in s
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- geometry ---------- */
const LC={x:1133,y:557};          // logo magnifier centre (logo units)
const NOSE={x:1032,y:641};
const HERO={x:960,y:560,s:.58}, FINAL={x:575,y:545,s:.47};

const bez=(p0,p1,p2,p3,k)=>{const u=1-k;return{x:u*u*u*p0.x+3*u*u*k*p1.x+3*u*k*k*p2.x+k*k*k*p3.x,y:u*u*u*p0.y+3*u*u*k*p1.y+3*u*k*k*p2.y+k*k*k*p3.y}};
const LP=[{x:2950,y:-420},{x:2500,y:1500},{x:1450,y:1150},LC];

    fx.globalAlpha=1-k*k; fx.fillStyle=p.red?'#C43211':'#141110';
    fx.save(); fx.translate(x,y); fx.rotate(p.ang);
    const sz=p.size*(1-k*.7), st=1+Math.min(v/450,3.2);
    fx.beginPath(); fx.ellipse(0,0,sz*st,sz,0,0,Math.PI*2); fx.fill(); fx.restore();
  }
  // nose splash on squash
  const N=toStage(NOSE,HERO);
  for(const p of splats){
    const dt=(t-1235)/1000; if(dt<0||dt*1000>p.life)continue; const k=dt*1000/p.life;
    const x=N.x+Math.cos(p.ang)*p.sp*dt, y=N.y-20+Math.sin(p.ang)*p.sp*dt+1800*dt*dt;
    fx.globalAlpha=1-k; fx.fillStyle='#C43211'; fx.beginPath(); fx.arc(x,y,p.size*(1-k*.5),0,Math.PI*2); fx.fill();
  }
  fx.globalAlpha=1;
}

function hud(t){
  const N=toStage(NOSE,HERO);
  const a=prog(t,40,380), fade=1-prog(t,560,760);
  const g=$('hudG'); g.style.opacity=fade; $('hudTxt').style.opacity=fade;
  if(fade<=0){return}
  const reach=outExpo(a)*1100;
  const set=(id,x1,y1,x2,y2)=>{const e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)};
  set('hx1',N.x-150,N.y,N.x-150-reach,N.y); set('hx2',N.x+150,N.y,N.x+150+reach,N.y);
  set('hy1',N.x,N.y-150,N.x,N.y-150-reach*.6); set('hy2',N.x,N.y+150,N.x,N.y+150+reach*.6);
  const hr=$('hring'); hr.setAttribute('cx',N.x); hr.setAttribute('cy',N.y); hr.setAttribute('r',90+60*(1-outExpo(prog(t,80,500))));
  hr.setAttribute('transform',`rotate(${t*.12} ${N.x} ${N.y})`); hr.style.opacity=prog(t,80,200)*.7;
  const d=lerp(300,82,outExpo(prog(t,120,520))), l=26; let p='';
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx,sy])=>{const x=N.x+sx*d,y=N.y+sy*d*.8;p+=`M${x-sx*-0},${y+sy*-l}L${x},${y}L${x-sx*l},${y}`});
  const br=$('br'); br.setAttribute('d',p); br.setAttribute('stroke-width',3); br.style.opacity=prog(t,120,220);
  const txt='CLUE #01\nX '+String(Math.round(N.x)).padStart(4,'0')+'  Y '+String(Math.round(N.y)).padStart(4,'0')+'\nSCENT ▸ 98.6%';
  const n=Math.floor(prog(t,180,520)*txt.length);
  const h=$('hudTxt'); h.textContent=txt.slice(0,n)+(n<txt.length&&n>0?'▌':''); h.style.left=(N.x+112)+'px'; h.style.top=(N.y+64)+'px';
}

/* ---------- master render: everything is a pure function of t ---------- */
function render(t){
  t=clamp(t,0,DUR);
  // camera: slow push + impact shake
  const push=1+.035*inOutSine(prog(t,0,DUR));
  const sk=prog(t,1170,1520), amp=sk>0&&sk<1?14*Math.pow(1-sk,2.2):0;
  const sx=amp*Math.sin(t*.21)*Math.cos(t*.047), sy=amp*Math.cos(t*.17);
  world.style.transform=`translate(${sx}px,${sy}px) scale(${push})`;

  // logo placement: hero centre -> left
  const mv=inOutExpo(prog(t,1480,2120));
  const L={x:lerp(HERO.x,FINAL.x,mv),y:lerp(HERO.y,FINAL.y,mv),s:lerp(HERO.s,FINAL.s,mv)};
  $('logo').setAttribute('transform',`translate(${L.x} ${L.y}) scale(${L.s}) translate(-820 -688)`);

  // clue nose in the dark
  const cn=outBack(prog(t,0,320),2.6), pulse=1+.06*Math.sin(t/55)*(1-prog(t,300,900));
  $('clue').setAttribute('transform',`translate(${NOSE.x} ${NOSE.y}) scale(${cn*pulse}) translate(${-NOSE.x} ${-NOSE.y})`);
  $('clue').style.opacity=1-prog(t,1050,1200);
  $('clueGlow').setAttribute('r',260+70*Math.sin(t/90));

  // the lens: flies in, magnifies, lands on the logo's own magnifier
  const P=lensAt(t), flying=t>=240;
  const m=lerp(1.45,1,inOutCubic(prog(t,420,840)));
  $('mag').setAttribute('transform',`translate(${P.x} ${P.y}) scale(${m}) translate(${-P.x} ${-P.y})`);
  const iris=inOutExpo(prog(t,880,1240));
  const ir=flying?lerp(226,3200,iris):0;
  ['irisC','paper'].forEach(id=>{const c=$(id);c.setAttribute('cx',P.x);c.setAttribute('cy',P.y);c.setAttribute('r',ir)});
  const land=spring((t-820)/1000,.07,26,9);
  const ring=$('lensRing'); ring.setAttribute('cx',P.x); ring.setAttribute('cy',P.y); ring.setAttribute('r',250*(1+land));
  const rc=prog(t,860,1120); ring.setAttribute('stroke',`rgb(${lerp(244,20,rc)},${lerp(238,17,rc)},${lerp(227,16,rc)})`);
  $('lens').style.opacity=flying?1-prog(t,1380,1560):0;
  // ghost trail during flight
  ghosts.forEach((g,i)=>{const tt=t-(i+1)*22, Q=lensAt(tt), on=t>260&&t<840;
    g.setAttribute('cx',Q.x);g.setAttribute('cy',Q.y);g.setAttribute('r',250);g.style.opacity=on?(.32-i*.07)*(1-prog(t,700,840)):0});
  // glass shine arc
  const sh=$('lensShine'), so=(flying?1:0)*(1-prog(t,820,1000))*.7, rr=200;
  sh.setAttribute('d',`M${P.x+rr*Math.cos(3.6)},${P.y+rr*Math.sin(3.6)} A${rr},${rr} 0 0 1 ${P.x+rr*Math.cos(4.5)},${P.y+rr*Math.sin(4.5)}`); sh.style.opacity=so;

  // ink draw-on
  for(const k of masks){const p=inOutSine(prog(t,k.a,k.b)); k.el.style.strokeDashoffset=k.L*(1-p)}
  const blink=t>2420&&t<2640?1-.92*Math.sin(Math.PI*prog(t,2420,2640)):1;
  for(const e of eyes){const s=outBack(prog(t,e.a,e.a+260),2.8);
    e.el.setAttribute('transform',`translate(${e.cx} ${e.cy}) scale(${s} ${s*blink}) translate(${-e.cx} ${-e.cy})`)}
  // nose squash & stretch on impact
  const q=(t-1230)/1000, sq=spring(q,.32,24,8);
  $('nose').setAttribute('transform',`translate(${NOSE.x} ${NOSE.y+50}) scale(${1+sq} ${1-sq*.8}) translate(${-NOSE.x} ${-NOSE.y-50})`);
  // lens glints
  const g1=prog(t,1000,1350), g2=prog(t,2380,2860), gl=$('lglint');
  const gk=g2>0?g2:g1; gl.setAttribute('transform',`rotate(28 1133 557) translate(${lerp(820,1500,inOutCubic(gk))} 0)`);
  gl.style.opacity=(g2>0?Math.sin(Math.PI*g2):Math.sin(Math.PI*g1))*.75;

  $('flash').style.opacity=.38*Math.pow(1-prog(t,1150,1400),3)*(t>=1150?1:0);
  $('vignette').style.opacity=lerp(1,.35,prog(t,900,1300));

  hud(t); drawFX(t);

  // ---- typography ----
  const w1=inOutExpo(prog(t,1640,1880)), w2=inOutExpo(prog(t,1880,2140)), wp=$('wipe');
  if(t<1880){wp.style.transformOrigin='0 50%';wp.style.transform=`scaleX(${w1})`}else{wp.style.transformOrigin='100% 50%';wp.style.transform=`scaleX(${1-w2})`}
  chars.forEach((c,i)=>{const k=outExpo(prog(t,1860+i*70,2400+i*70));
    c.style.transform=`translateY(${(1-k)*105}%) rotate(${(1-k)*(i?6:-6)}deg)`});
  const cg=$('cnGlint'); cg.style.backgroundPosition=`${lerp(110,-10,inOutCubic(prog(t,2300,2800)))}% 0`;
  const tr=lerp(.95,.42,outExpo(prog(t,1960,2700)));
  en.style.letterSpacing=tr+'em';
  letters.forEach((s,i)=>{const k=prog(t,1960+i*48,2380+i*48), e=outExpo(k);
    s.style.opacity=clamp(k*2.2); s.style.transform=`translateY(${(1-e)*46}px) scale(${lerp(1.5,1,e)})`; s.style.filter=`blur(${(1-e)*14}px)`});
  $('rule').style.transform=`scaleX(${inOutExpo(prog(t,2140,2560))})`;
  $('dot').style.transform=`scale(${outBack(prog(t,2480,2700),3)})`;
  const tg=outCubic(prog(t,2300,2760)), tag=$('tag');
  tag.style.clipPath=`inset(-10px ${100-tg*100}% -10px 0)`; tag.style.transform=`translateX(${(1-tg)*-24}px)`;

  // grain + timecode
  const r=rng(Math.floor(t/16.67)+1)(), r2=rng(Math.floor(t/16.67)+99)();
  $('grain').style.transform=`translate(${r*64-32}px,${r2*64-32}px)`;
  const f=Math.floor(t/1000*60);
  $('tcode').textContent=`00:00:${String(Math.floor(f/60)).padStart(2,'0')}:${String(f%60).padStart(2,'0')}`;
  $('scrub').value=t; $('tc').textContent=(t/1000).toFixed(3)+'s';
}

/* ---------- layout ---------- */
function fit(){
  const cap=document.body.classList.contains('capture');
  const vp=$('viewport').getBoundingClientRect();
  const s=cap?window.innerWidth/1920:Math.min(vp.width/1920,vp.height/1080);
  stage.style.transform=`scale(${s})`; frame.style.width=1920*s+'px'; frame.style.height=1080*s+'px';
}
addEventListener('resize',fit);

/* ---------- player ---------- */
const qs=new URLSearchParams(location.search);
let t=0,last=null,playing=true,speed=1,loop=true,hold=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tick(now){
  if(last==null)last=now; const dt=now-last; last=now;
  if(playing){
    if(t<DUR){t=Math.min(DUR,t+dt*speed)}
    else if(loop){hold+=dt; if(hold>HOLD){t=0;hold=0}}
    else playing=false;
    render(t);
  }
  requestAnimationFrame(tick);
}
$('play').onclick=()=>{t=0;hold=0;playing=true};
$('slow').onclick=e=>{speed=speed===1?.25:1;e.currentTarget.setAttribute('aria-pressed',speed!==1)};
$('loop').onclick=e=>{loop=!loop;e.currentTarget.setAttribute('aria-pressed',loop);if(loop&&t>=DUR)playing=true};
$('scrub').oninput=e=>{playing=false;t=+e.target.value;render(t)};
$('scrub').onchange=()=>{};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(t>=DUR){t=0;hold=0}playing=!playing}
  if(e.key==='ArrowRight'){playing=false;t=clamp(t+1000/60,0,DUR);render(t)} if(e.key==='ArrowLeft'){playing=false;t=clamp(t-1000/60,0,DUR);render(t)}});

window.__render=render;
if(qs.has('capture')){document.body.classList.add('capture');fit();render(+qs.get('t')||0)}
else{fit(); if(reduce){t=DUR;playing=false;render(DUR)} else {document.fonts.ready.then(()=>requestAnimationFrame(tick))}}
})();
</script>
