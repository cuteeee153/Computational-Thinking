<!doctype html><html><head><meta charset="utf-8">
<style>
:root{--bg:#F6F2EC;--ink:#1D1B19;--sub:#8A847C;--apricot:#F0915A;--coral:#E86A55;--sand:#E9E1D6}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px}
.f{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(1400px 900px at 50% 0%,#FBF8F4 0,var(--bg) 70%);color:var(--ink);font-family:'Inter','Noto Sans TC';-webkit-font-smoothing:antialiased}
.eyebrow{position:absolute;font-size:26px;font-weight:500;color:var(--apricot);letter-spacing:.08em}
.phone{position:absolute;width:420px;height:860px;border-radius:70px;background:linear-gradient(160deg,#F4F1EC,#CFC8BE);padding:14px;
  box-shadow:0 2px 0 rgba(255,255,255,.8) inset,0 -2px 6px rgba(0,0,0,.12) inset,0 80px 120px -40px rgba(80,60,40,.35),0 30px 40px -20px rgba(80,60,40,.25)}
.screen{width:100%;height:100%;border-radius:58px;background:#fff;overflow:hidden;position:relative}
.island{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#111}
.res{margin:0 26px;padding:26px 0;border-bottom:1px solid #EEE9E2;font-family:'Noto Sans TC'}
.res small{font-size:17px;color:var(--sub);font-family:'Inter';display:block;margin-bottom:8px}
.res h5{font-size:25px;font-weight:500;line-height:1.4}
.res em{font-style:normal;background:#FDE8DA;color:#C9572B;padding:0 6px;border-radius:6px}
.big{font-family:'Inter';font-weight:200;letter-spacing:-.04em;line-height:1}
.big span{font-family:'Noto Sans TC';font-weight:300;font-size:.36em;letter-spacing:0;margin-left:10px}
.lbl{font-family:'Noto Sans TC';font-size:22px;color:var(--sub);margin-top:6px}
.tile{position:absolute;width:400px;border-radius:36px;background:#fff;padding:36px 38px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 40px 70px -30px rgba(80,60,40,.28)}
.tile .n{font-family:'Inter';font-weight:700;font-size:20px;color:var(--apricot);letter-spacing:.1em}
.tile h3{font-family:'Noto Sans TC';font-weight:700;font-size:38px;margin-top:14px}
.tile p{font-family:'Noto Sans TC';font-size:22px;color:var(--sub);margin-top:10px}
.grad{background:linear-gradient(90deg,#F0915A,#E86A55);-webkit-background-clip:text;color:transparent}
</style></head><body>
<script src="dog.js"></script>

<!-- ============ FRAME 1 : HOOK ============ -->
<section class="f">
  <div class="eyebrow" style="left:140px;top:120px">狗關節保養</div>
  <div style="position:absolute;left:140px;top:170px;font-family:'Noto Sans TC';font-weight:700;font-size:72px;letter-spacing:-.01em;line-height:1.2">三篇文章，<br><span style="color:var(--sub);font-weight:300">三個答案。</span></div>

  <div class="phone" style="left:760px;top:150px;transform:rotate(0deg)"><div class="screen">
    <div class="island"></div>
    <div style="margin:84px 26px 10px;padding:16px 22px;border-radius:18px;background:#F4F1EC;font-family:'Noto Sans TC';font-size:22px;color:#6E675F">🔍 狗 關節保養 幾歲開始</div>
    <div class="res"><small>文章 A</small><h5>老狗照護：<em>七歲</em>才要顧關節</h5></div>
    <div class="res"><small>文章 B</small><h5>大型犬<em>五歲</em>就要吃保健品</h5></div>
    <div class="res"><small>文章 C</small><h5><em>三到五歲</em>就開始退化</h5></div>
    <div class="res" style="opacity:.35"><small>文章 D</small><h5>⋯⋯</h5></div>
  </div></div>

  <!-- the three numbers, product-spec style -->
  <div style="position:absolute;left:1300px;top:200px">
    <div class="big" style="font-size:200px">7<span>歲？</span></div><div class="lbl">文章 A</div>
  </div>
  <div style="position:absolute;left:1300px;top:470px;opacity:.55">
    <div class="big" style="font-size:200px">5<span>歲？</span></div><div class="lbl">文章 B</div>
  </div>
  <div style="position:absolute;left:1300px;top:740px;opacity:.28">
    <div class="big" style="font-size:200px">3<span>歲？</span></div><div class="lbl">文章 C</div>
  </div>
  <div style="position:absolute;left:1260px;top:230px;width:2px;height:700px;background:linear-gradient(var(--sand),transparent)"></div>

  <!-- dog -->
  <div style="position:absolute;left:330px;top:640px;width:320px;height:40px;border-radius:50%;background:radial-gradient(closest-side,rgba(80,60,40,.18),transparent);top:818px"></div>
  <div style="position:absolute;left:360px;top:560px;width:260px" id="dogD1"></div>
</section>

<!-- ============ FRAME 2 : CORE ============ -->
<section class="f">
  <div class="eyebrow" style="left:50%;transform:translateX(-50%);top:120px">先講結論</div>
  <div style="position:absolute;left:0;right:0;top:170px;text-align:center;font-family:'Noto Sans TC';font-weight:700;font-size:96px;letter-spacing:-.01em">
    <span style="color:#BDB5AA;font-weight:300;text-decoration:line-through;text-decoration-thickness:4px;text-decoration-color:#E86A55">幾歲</span>
    <span style="color:#BDB5AA;font-weight:300">→</span>
    <span class="grad">風險等級</span>
  </div>
  <div style="position:absolute;left:0;right:0;top:310px;text-align:center;font-family:'Noto Sans TC';font-size:32px;color:var(--sub)">要不要開始，看的是風險因子，不是生日。</div>

  <div class="tile" style="left:300px;top:640px"><div class="n">STEP 01</div><h3>有風險因子嗎？</h3><p>品種、體重、受傷史⋯</p></div>
  <div class="tile" style="left:760px;top:560px;opacity:.6"><div class="n">STEP 02</div><h3>有蛛絲馬跡嗎？</h3><p>跛行、起身變慢⋯</p></div>
  <div class="tile" style="left:1220px;top:480px;opacity:.35"><div class="n">STEP 03</div><h3>該做什麼？</h3><p>依分組行動</p></div>
  <div style="position:absolute;left:330px;top:475px;width:150px" id="dogD2"></div>
</section>
<script>
const P={mode:'flat',body:'#E7A46A',dark:'#B9733F',light:'#FFF6EA',nose:'#2A211C',collar:'#E86A55',tag:'#F5C26B',blush:'#F3A08A'};
dogD1.innerHTML = dogSVG(Object.assign({id:'d1',tilt:-12,mood:'curious'},P));
dogD2.innerHTML = dogSVG(Object.assign({id:'d2',tilt:4,mood:'happy'},P));
</script>
</body></html>
