<!doctype html><html><head><meta charset="utf-8">
<style>
:root{--bg:#F3EDE4;--panel:#FFFDF9;--ink:#2A2420;--sub:#8B8178;--line:#EAE2D7;--terra:#D9774B;--terra-l:#FBE6DA;--sage:#6F9580;--sage-l:#E2ECE5;--honey:#E7B04A;--honey-l:#FAEFD6}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px}
.f{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC';-webkit-font-smoothing:antialiased}
.dots{position:absolute;inset:0;background-image:radial-gradient(#DCD3C6 1.4px,transparent 1.4px);background-size:32px 32px;opacity:.6}
.win{position:absolute;border-radius:28px;background:var(--panel);box-shadow:0 0 0 1px rgba(60,40,20,.06),0 50px 90px -40px rgba(80,55,30,.35)}
.bar{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:10px}
.bar i{width:13px;height:13px;border-radius:50%;background:#E5DCCF;display:inline-block}
.search{margin:28px 36px 10px;height:72px;border-radius:18px;border:1.5px solid var(--line);display:flex;align-items:center;padding:0 24px;font-size:28px;color:var(--ink);gap:16px}
.search .cur{width:2px;height:34px;background:var(--terra)}
.r{margin:0 36px;padding:24px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px}
.r .fav{width:52px;height:52px;border-radius:14px;flex:none}
.r h5{font-size:28px;font-weight:500}
.r small{display:block;font-size:19px;color:var(--sub);margin-top:4px;font-family:'Inter','Noto Sans TC'}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:999px;font-size:26px;font-weight:700;margin-left:auto;flex:none}
.toast{position:absolute;display:flex;align-items:center;gap:16px;padding:20px 28px;border-radius:20px;background:var(--ink);color:#FFF8F0;font-size:28px;box-shadow:0 30px 60px -20px rgba(42,36,32,.5)}
.card{position:absolute;border-radius:28px;background:var(--panel);box-shadow:0 0 0 1px rgba(60,40,20,.06),0 40px 70px -35px rgba(80,55,30,.35);padding:30px}
.avatar{width:110px;height:110px;border-radius:50%;background:var(--honey-l);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.seg{display:inline-flex;padding:8px;border-radius:999px;background:#EDE5DA;gap:6px}
.seg div{padding:16px 40px;border-radius:999px;font-size:34px;font-weight:700}
.step{display:flex;gap:26px;align-items:flex-start;padding:26px 0}
.step .no{width:64px;height:64px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Inter';font-weight:700;font-size:28px}
.skel{height:16px;border-radius:8px;background:#EEE7DD;margin-top:14px}
.label{position:absolute;font-family:'Inter';font-weight:500;font-size:22px;color:var(--sub);letter-spacing:.12em}
</style></head><body>
<script src="dog.js"></script>

<!-- ============ FRAME 1 : HOOK ============ -->
<section class="f">
  <div class="dots"></div>
  <div class="label" style="left:120px;top:90px">狗關節保養 ・ 幾歲開始？</div>

  <div class="win" style="left:120px;top:150px;width:1060px;height:780px">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="search">🔍 狗 關節保養 幾歲開始<span class="cur"></span></div>
    <div class="r"><div class="fav" style="background:var(--terra-l)"></div><div><h5>老狗照護：什麼時候要開始顧關節？</h5><small>文章 A ・ 3 分鐘閱讀</small></div><span class="chip" style="background:var(--terra-l);color:var(--terra)">7 歲</span></div>
    <div class="r"><div class="fav" style="background:var(--sage-l)"></div><div><h5>大型犬一定要知道的保健品時機</h5><small>文章 B ・ 5 分鐘閱讀</small></div><span class="chip" style="background:var(--sage-l);color:var(--sage)">5 歲</span></div>
    <div class="r"><div class="fav" style="background:var(--honey-l)"></div><div><h5>關節退化比你想的還早</h5><small>文章 C ・ 4 分鐘閱讀</small></div><span class="chip" style="background:var(--honey-l);color:#B3821F">3–5 歲</span></div>
    <div class="r" style="border:none;opacity:.4"><div class="fav" style="background:#EEE7DD"></div><div style="flex:1"><div class="skel" style="width:60%"></div><div class="skel" style="width:35%"></div></div></div>
  </div>

  <!-- conflict toast -->
  <div class="toast" style="left:760px;top:840px"><span style="width:38px;height:38px;border-radius:50%;background:var(--terra);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px">!</span>3 個答案，互相矛盾</div>

  <!-- dog profile card -->
  <div class="card" style="left:1290px;top:260px;width:500px">
    <div style="display:flex;gap:24px;align-items:center">
      <div class="avatar"><div style="width:120px;margin-bottom:-38px" id="dogE1"></div></div>
      <div><div style="font-size:22px;color:var(--sub)">我家這隻</div><div style="font-size:38px;font-weight:700;margin-top:4px">現在要開始嗎？</div></div>
    </div>
    <div style="margin-top:30px;padding:22px 24px;border-radius:18px;background:#F6F1EA;display:flex;justify-content:space-between;align-items:center;font-size:26px">
      <span style="color:var(--sub)">建議開始年齡</span><span style="font-family:'Inter';font-weight:700;font-size:40px;color:#C9BFB2">? ? ?</span>
    </div>
    <div style="display:flex;gap:10px;margin-top:20px">
      <span class="chip" style="margin:0;background:var(--terra-l);color:var(--terra);font-size:22px">7 歲？</span>
      <span class="chip" style="margin:0;background:var(--sage-l);color:var(--sage);font-size:22px">5 歲？</span>
      <span class="chip" style="margin:0;background:var(--honey-l);color:#B3821F;font-size:22px">3 歲？</span>
    </div>
  </div>
</section>

<!-- ============ FRAME 2 : CORE ============ -->
<section class="f">
  <div class="dots"></div>
  <div class="label" style="left:120px;top:90px">先講結論</div>

  <div style="position:absolute;left:120px;top:220px;font-size:84px;font-weight:700;line-height:1.25">不是幾歲，<br>是<span style="color:var(--terra)">風險等級</span>。</div>
  <div style="position:absolute;left:120px;top:470px" class="seg">
    <div style="color:#B9AEA2;text-decoration:line-through;text-decoration-thickness:3px">依年齡</div>
    <div style="background:var(--panel);color:var(--terra);box-shadow:0 8px 20px -8px rgba(80,55,30,.35)">依風險因子</div>
  </div>
  <div style="position:absolute;left:120px;top:610px;font-size:30px;color:var(--sub);line-height:1.7">三個步驟，<br>找到你家狗現在的位置。</div>

  <div class="card" style="left:1000px;top:200px;width:800px;padding:36px 44px">
    <div style="display:flex;gap:22px;align-items:center;padding-bottom:26px;border-bottom:1px solid var(--line)">
      <div class="avatar" style="width:90px;height:90px"><div style="width:100px;margin-bottom:-32px" id="dogE2"></div></div>
      <div><div style="font-size:22px;color:var(--sub)">關節保養評估</div><div style="font-size:34px;font-weight:700">我家這隻・定位中</div></div>
      <div style="margin-left:auto;font-family:'Inter';font-weight:700;font-size:24px;color:var(--terra)">1 / 3</div>
    </div>
    <div class="step"><div class="no" style="background:var(--terra);color:#fff">1</div><div style="flex:1"><div style="font-size:34px;font-weight:700">有風險因子嗎？</div><div style="font-size:24px;color:var(--sub);margin-top:6px">品種、體重、受傷史、家族病史、幼犬期生長</div></div></div>
    <div style="margin-left:31px;width:2px;height:24px;background:var(--line)"></div>
    <div class="step" style="opacity:.55"><div class="no" style="background:#EEE7DD;color:var(--sub)">2</div><div style="flex:1"><div style="font-size:34px;font-weight:700;color:var(--sub)">有沒有蛛絲馬跡？</div><div class="skel" style="width:70%"></div></div></div>
    <div style="margin-left:31px;width:2px;height:24px;background:var(--line)"></div>
    <div class="step" style="opacity:.35"><div class="no" style="background:#EEE7DD;color:var(--sub)">3</div><div style="flex:1"><div style="font-size:34px;font-weight:700;color:var(--sub)">該做什麼？</div><div class="skel" style="width:50%"></div></div></div>
  </div>
</section>
<script>
const P={mode:'flat',body:'#E3A266',dark:'#B87240',light:'#FFF6EA',nose:'#2A2420',collar:'#D9774B',tag:'#E7B04A',blush:'#F2A08A'};
dogE1.innerHTML = dogSVG(Object.assign({id:'e1',tilt:-10,mood:'curious'},P));
dogE2.innerHTML = dogSVG(Object.assign({id:'e2',tilt:0,mood:'happy'},P));
</script>
</body></html>
